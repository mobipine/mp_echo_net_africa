[program:enaf-reverb-server]
process_name=%(program_name)s
command=/usr/bin/php /var/www/enaf/artisan reverb:start --host=127.0.0.1 --port=8080
directory=/var/www/enaf
numprocs=1
autostart=true
autorestart=true
startsecs=5
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/enaf/storage/logs/reverb-server.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=60
stopsignal=TERM
stopasgroup=true
killasgroup=true
environment=HOME="/var/www",USER="www-data"
