; Dedicated single-concurrency worker for memory-intensive credit report workbooks.
[program:enaf-credit-reports-worker]
process_name=%(program_name)s
command=/usr/bin/php /var/www/enaf/artisan queue:work credit-reports --queue=credit-reports --sleep=3 --tries=1 --timeout=3600 --max-time=3600 --memory=512
directory=/var/www/enaf
numprocs=1
autostart=true
autorestart=true
startsecs=5
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/enaf/storage/logs/credit-reports-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=3660
stopsignal=TERM
stopasgroup=true
killasgroup=true
