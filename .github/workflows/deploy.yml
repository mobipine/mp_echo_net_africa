name: Deploy Echo Net Africa to Server

on:
  push:
    branches:
      - main  # Trigger this action when you push to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest  # Runs on an Ubuntu machine

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Install sshpass
      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      # Step 3: Deploy to server via SSH
      - name: Deploy to server
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no root@213.199.58.213 << 'EOF'
            cd /var/www/enaf
            git pull
            composer install --no-interaction --prefer-dist --optimize-autoloader
            npm ci
            npm run build
            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache
            php artisan optimize
            php artisan queue:restart
            install -m 0644 deploy/supervisor/enaf-credit-reports-worker.conf /etc/supervisor/conf.d/enaf-credit-reports-worker.conf
            supervisorctl reread
            supervisorctl update
          EOF

      - name: Run reporting tests on production host (isolated database)
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no root@213.199.58.213 << 'EOF'
            cd /var/www/enaf
            APP_CONFIG_CACHE="/var/www/enaf/bootstrap/cache/config-test-${{ github.sha }}.php"
            test ! -e "$APP_CONFIG_CACHE"
            APP_ENV=testing \
            APP_CONFIG_CACHE="$APP_CONFIG_CACHE" \
            DB_CONNECTION=sqlite \
            DB_DATABASE=:memory: \
            DB_URL= \
            CACHE_STORE=array \
            SESSION_DRIVER=array \
            QUEUE_CONNECTION=sync \
            MAIL_MAILER=array \
            LOG_CHANNEL=stderr \
            php artisan test tests/Feature/CreditUtilizationReportingTest.php
          EOF
